# Local dev stack: docker compose up -d   (override secrets via .env, never commit it)
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sentinelpay
      POSTGRES_USER: ${PG_USER:-sentinel}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in .env}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U ${PG_USER:-sentinel} -d sentinelpay"], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    command: ["redis-server","--requirepass","${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}","--appendonly","yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD","redis-cli","-a","${REDIS_PASSWORD}","ping"], interval: 5s, retries: 10 }
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-sentinel}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:?set RABBIT_PASSWORD in .env}
    ports: ["5672:5672","15672:15672"]
    volumes: [rabbitdata:/var/lib/rabbitmq]
    healthcheck: { test: ["CMD","rabbitmq-diagnostics","-q","ping"], interval: 10s, retries: 10 }
  api:
    build: { context: ./backend, dockerfile: ../infra/docker/Dockerfile.api }
    profiles: ["full"]
    depends_on: { postgres: {condition: service_healthy}, redis: {condition: service_healthy}, rabbitmq: {condition: service_healthy} }
    environment:
      ConnectionStrings__Postgres: Host=postgres;Database=sentinelpay;Username=${PG_USER:-sentinel};Password=${PG_PASSWORD}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD}
      Messaging__Provider: RabbitMq
      Messaging__RabbitMq__Host: rabbitmq
      Messaging__RabbitMq__User: ${RABBIT_USER:-sentinel}
      Messaging__RabbitMq__Password: ${RABBIT_PASSWORD}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY (>=32 chars)}
    ports: ["8080:8080"]
    volumes: [apilogs:/app/logs]
volumes: { pgdata: {}, redisdata: {}, rabbitdata: {}, apilogs: {} }
